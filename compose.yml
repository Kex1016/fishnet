# One service. Only Caddy on the host reaches the site, at 127.0.0.1:3000 (deploy/Caddyfile.example).
# deploy/deploy.sh sets FISHNET_TAG (the commit) and FISHNET_UID/FISHNET_GID (the host user, so the
# ./data bind mount is writable without a chown); running `docker compose up -d` by hand works too.
services:
  fishnet:
    build:
      context: .
      args:
        COMMIT: ${FISHNET_TAG:-dev}
    image: fishnet:${FISHNET_TAG:-latest}
    container_name: fishnet
    restart: unless-stopped
    init: true
    user: "${FISHNET_UID:-1000}:${FISHNET_GID:-1000}"
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
